<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Embtec Konzultz</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;display=swap">
  <!-- Self-contained on purpose: GitHub Pages serves this file at any missing URL,
       where relative links to /assets would not resolve. -->
  <style>
    :root { --paper: #f4f1ea; --ink: #16140f; --ink-2: #3b3830; --ink-3: #6b665b; --gold: #e9cc24; --gold-2: #d9bb12; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      align-content: center;
      padding: 32px clamp(20px, 6vw, 80px);
      background: var(--paper);
      color: var(--ink);
      font: 18px/1.6 "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 900px; padding-top: 22px; border-top: 1px solid var(--ink); }
    .label { font-size: 15px; font-weight: 600; margin: 0; }
    h1 {
      margin: 28px 0 0;
      font: 400 clamp(52px, 9vw, 120px)/0.94 "Newsreader", Georgia, serif;
      letter-spacing: -0.03em;
    }
    h1 em {
      background-image: linear-gradient(transparent 60%, rgba(233, 204, 36, 0.55) 60%, rgba(233, 204, 36, 0.55) 90%, transparent 90%);
      padding-inline: 0.04em;
    }
    p.note { margin: 28px 0 0; max-width: 46ch; color: var(--ink-2); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; margin-top: 36px; }
    .btn {
      display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px;
      border-radius: 3px; background: var(--gold); color: var(--ink);
      font-weight: 600; text-decoration: none;
    }
    .btn:hover { background: var(--gold-2); }
    .link { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
    :focus-visible { outline: 2px solid #2418a6; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="label">Error 404</p>
    <h1>This page <em>isn’t here.</em></h1>
    <p class="note">The link may be old, or the address may have a typo. Everything about our courses and the lab is on the home page.</p>
    <div class="actions">
      <a class="btn" href="/embtec/" data-home>Go to the home page</a>
      <a class="link" href="/embtec/courses.html" data-home="courses.html">See the courses</a>
    </div>
  </main>
  <script>
    // Works on the GitHub Pages project path (/embtec/) and on a custom domain (/).
    var base = location.pathname.indexOf('/embtec/') === 0 ? '/embtec/' : '/';
    document.querySelectorAll('[data-home]').forEach(function (a) { a.href = base + (a.getAttribute('data-home') || ''); });
  </script>
</body>
</html>
