<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Embtec Konzultz</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0d12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <!-- Self-contained on purpose: GitHub Pages serves this file at any missing URL,
       so relative links to /assets would break on nested paths. -->
  <style>
    :root { --ink: #0c0d12; --ink-line: rgba(255,255,255,.08); --on-ink: #f3f3ee; --on-ink-2: #aeb1bc; --gold: #e9cc24; --gold-hi: #f5dc4c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px;
      background:
        radial-gradient(640px 420px at 85% 0%, rgba(233,204,36,.16), transparent 70%),
        radial-gradient(720px 520px at 0% 100%, rgba(58,47,208,.3), transparent 70%),
        var(--ink);
      color: var(--on-ink);
      font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 640px; text-align: center; }
    .code {
      display: inline-flex; gap: 10px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--ink-line); background: rgba(255,255,255,.03);
      font: 500 13px/1.4 "JetBrains Mono", ui-monospace, monospace; color: var(--on-ink-2);
    }
    .code b { color: var(--gold); font-weight: 500; }
    h1 {
      margin: 28px 0 0; font-size: clamp(96px, 22vw, 200px); font-weight: 900; font-stretch: 125%;
      line-height: .85; letter-spacing: -.05em;
    }
    h1 span { color: var(--gold); }
    p { margin: 24px auto 0; max-width: 42ch; font-size: 18px; line-height: 1.6; color: var(--on-ink-2); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; }
    a.btn {
      display: inline-flex; align-items: center; height: 54px; padding: 0 26px; border-radius: 999px;
      font-weight: 600; text-decoration: none; transition: transform .25s, background-color .2s;
    }
    a.btn:hover { transform: translateY(-2px); }
    .gold { background: var(--gold); color: var(--ink); }
    .gold:hover { background: var(--gold-hi); }
    .ghost { border: 1px solid rgba(255,255,255,.16); color: var(--on-ink); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="code"><b>GET</b> this page → 404 Not Found</span>
    <h1>4<span>0</span>4</h1>
    <p>This page didn’t make it to production. Let’s get you back to something that works.</p>
    <div class="actions">
      <a class="btn gold" href="/embtec/" data-home>Back to home</a>
      <a class="btn ghost" href="/embtec/courses.html" data-home="courses.html">View courses</a>
    </div>
  </main>
  <script>
    // Works on the GitHub Pages project path (/embtec/) and on a custom domain (/).
    var base = location.pathname.indexOf('/embtec/') === 0 ? '/embtec/' : '/';
    document.querySelectorAll('[data-home]').forEach(function (a) { a.href = base + (a.getAttribute('data-home') || ''); });
  </script>
</body>
</html>
