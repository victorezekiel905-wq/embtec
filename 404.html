<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Embtec Konzultz</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0f31">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@500,700&amp;display=swap">
  <!-- Self-contained on purpose: GitHub Pages serves this file at any missing URL,
       where relative links to /assets would not resolve. -->
  <style>
    :root { --navy: #060922; --royal: #2f2ce0; --gold: #f7c928; --coral: #ff5a47; --mint: #0fae78; --violet: #7a55ff; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      overflow: hidden;
      background: var(--navy);
      color: #fff;
      font: 500 17px/1.6 "Satoshi", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .55; animation: float 14s ease-in-out infinite alternate; }
    .o1 { width: 340px; height: 340px; background: var(--royal); left: -80px; top: -60px; }
    .o2 { width: 280px; height: 280px; background: var(--coral); right: -60px; bottom: -40px; animation-delay: -5s; }
    .o3 { width: 220px; height: 220px; background: var(--violet); right: 20%; top: 10%; animation-delay: -9s; }
    @keyframes float { to { transform: translate(40px, 30px) scale(1.1); } }
    main { position: relative; max-width: 640px; text-align: center; }
    .code {
      font: 600 clamp(110px, 26vw, 220px)/0.9 "Satoshi", sans-serif;
      letter-spacing: -0.05em;
      background: linear-gradient(90deg, var(--gold), #ff8a7a, #b6a3ff, #4fe0aa, var(--gold));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 8s linear infinite;
    }
    @keyframes sheen { to { background-position: 200% 0; } }
    h1 { margin: 18px 0 0; font: 600 clamp(28px, 5vw, 44px)/1.1 "Satoshi", sans-serif; letter-spacing: -0.02em; }
    p { margin: 16px auto 0; max-width: 44ch; color: #b6bbe0; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    a.btn { display: inline-flex; align-items: center; min-height: 54px; padding: 0 26px; border-radius: 999px; font-weight: 700; text-decoration: none; transition: transform .35s cubic-bezier(.22,1,.36,1); }
    a.btn:hover { transform: translateY(-2px); }
    .gold { background: var(--gold); color: var(--navy); }
    .glass { border: 1px solid rgba(255,255,255,.3); color: #fff; background: rgba(255,255,255,.08); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .orb, .code { animation: none; } }
  </style>
</head>
<body>
  <span class="orb o1" aria-hidden="true"></span><span class="orb o2" aria-hidden="true"></span><span class="orb o3" aria-hidden="true"></span>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page could not be found.</h1>
    <p>The link may be old, or the address may have a typo. Everything about our courses and services is a click away.</p>
    <div class="actions">
      <a class="btn gold" href="/embtec/" data-home>Back to home</a>
      <a class="btn glass" href="/embtec/courses.html" data-home="courses.html">View courses</a>
    </div>
  </main>
  <script>
    // Works on the GitHub Pages project path (/embtec/) and on a custom domain (/).
    var base = location.pathname.indexOf('/embtec/') === 0 ? '/embtec/' : '/';
    document.querySelectorAll('[data-home]').forEach(function (a) { a.href = base + (a.getAttribute('data-home') || ''); });
  </script>
</body>
</html>
